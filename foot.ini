# Dreamwave foot colours (from colors.toml). alpha makes foot's background
# see-through, which is what lets Hyprland blur behind it as in the preview.
[colors-dark]
foreground=f5eafd
background=0a0716
# Blur only applies while the background is see-through, as with Glassy windows,
# and foot reads it only at launch, so it is on from the start.
blur=yes
alpha=0.85
selection-foreground=f5eafd
selection-background=3b1f5c

cursor=0a0716 f5eafd

regular0=0a0716
regular1=a70b68
regular2=7f049e
regular3=790aac
regular4=ca2cb0
regular5=a604e9
regular6=c429b2
regular7=f5eafd

bright0=8c53b7
bright1=f1279f
bright2=c911f8
bright3=b52af3
bright4=e37bd1
bright5=cc58fc
bright6=ef6469
bright7=f5eafd
